<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/img/launchericon-192x192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/launchericon-192x192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NutriMax">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Estadísticas — NutriMax</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111827">
  <meta name="view-transition" content="same-origin">
  <!-- Flatpickr for beautiful calendars -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content" style="padding: 16px 16px 105px 16px; max-width: 600px; margin: 0 auto;">
      <h1 style="font-size:24px; font-weight:900; color:var(--text-main); margin-bottom:20px;">Tu Progreso</h1>

      <!-- Weight Tracker Card -->
      <div class="stat-card">
        <div class="stat-heading">⚖️ Peso Actual</div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div class="stat-big-number" id="currentWeightVal">-- <span>kg</span></div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
            <input type="date" id="weightDateSel" onchange="renderWeightTracker()"
              style="background:var(--bg-app); border:1px solid var(--border); color:var(--text-main); font-size:12px; font-weight:700; padding:6px 10px; border-radius:8px; outline:none; cursor:pointer;"
              title="Seleccionar fecha" />
            <button class="btn btn-primary btn-sm" onclick="promptNewWeight()" style="width:100%;">Actualizar</button>
          </div>
        </div>
        <div style="margin-top:20px; height:140px;">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <!-- Perfect Days Card — conectada a la BD -->
      <div class="stat-card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
          <div class="stat-heading" style="margin-bottom:0;">⭐ Días Perfectos</div>
          <!-- Botón Recalcular: evalúa todos los días pendientes del historial -->
          <button
            id="btnRecalcularStats"
            onclick="onRecalcularStats()"
            title="Recalcular historial completo (hasta 90 días)"
            style="
              display:flex; align-items:center; gap:6px;
              background:var(--bg-app); border:1px solid var(--border);
              color:var(--primary); font-size:12px; font-weight:700;
              padding:6px 10px; border-radius:8px; cursor:pointer;
              transition: background 0.2s, transform 0.2s;
            "
            onmouseover="this.style.background='var(--primary-alpha,rgba(124,58,237,.1))'"
            onmouseout="this.style.background='var(--bg-app)'">
            <svg id="iconRecalcStats" width="14" height="14" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M8 16H3v5"/>
            </svg>
            Recalcular
          </button>
        </div>
        <p style="font-size:13px; color:var(--text-muted); margin-top:4px; margin-bottom:16px;">
          Días donde cumpliste <strong>todos</strong> tus macros en ±10%.
        </p>
        <div style="display:flex; align-items:center; gap:20px;">
          <div style="position:relative; width:80px; height:80px; display:flex; align-items:center; justify-content:center;">
            <svg style="position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); overflow:visible;">
              <circle cx="40" cy="40" r="34" fill="none" stroke="var(--bg-app)" stroke-width="8" />
              <circle id="perfectRing" cx="40" cy="40" r="34" fill="none" stroke="var(--primary)" stroke-width="8"
                stroke-dasharray="213.6" stroke-dashoffset="213.6"
                style="transition: stroke-dashoffset 1.5s ease-out; stroke-linecap:round;" />
            </svg>
            <div style="font-size:18px; font-weight:800; color:var(--text-main); z-index:2;" id="perfectVal">—</div>
          </div>
          <div>
            <div style="font-size:22px; font-weight:900; color:var(--text-main);" id="perfectDaysCount">0</div>
            <div style="font-size:12px; font-weight:700; color:var(--text-muted); margin-top:2px;">días perfectos acumulados</div>
            <div style="font-size:12px; font-weight:600; color:var(--primary); margin-top:4px;">¡Sigue así! 🔥</div>
          </div>
        </div>
      </div>

      <!-- Weekly Avg Card -->
      <div class="stat-card">
        <div class="stat-heading">📊 Promedio 7 Días</div>
        <div class="mb-16">
          <div class="stat-big-number" id="avgCalVal">-- <span>kcal / día</span></div>
        </div>
        <div class="grid-3" style="gap:12px;">
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Proteínas
            </div>
            <div style="font-size:15px; font-weight:800; color:var(--text-main);"><span id="avgProVal">--</span>g</div>
          </div>
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">
              Carbohidratos</div>
            <div style="font-size:15px; font-weight:800; color:var(--text-main);"><span id="avgCarVal">--</span>g</div>
          </div>
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Grasas
            </div>
            <div style="font-size:15px; font-weight:800; color:var(--text-main);"><span id="avgFatVal">--</span>g</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.currentActivePage = 'stats';
    if (!requireAuth()) throw new Error('not logged in');
    initSidebar('stats');
    initFlatpickr();

    const user    = getUser();
    const goals   = getGoals();
    const targets = goals?.targets ?? { calories: 2000, protein: 150, carbs: 225, fat: 55 };

    // Garantizar que exista el registro del día al cargar stats
    ensureDailyRecord(todayKey());

    async function renderPage() {
      await renderWeightTracker();
      renderPerfectDays();  // Render inicial con datos del perfil local
      renderWeeklyAvg();

      // Evaluar ayer automáticamente (si tiene datos y aún no fue evaluado)
      const ayer = (() => {
        const d = new Date(); d.setDate(d.getDate() - 1);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      })();
      evaluarDiaPerfecto(ayer, targets);
    }

    // ── Renderiza el contador de Días Perfectos desde el perfil local (fuente: BD) ──
    function renderPerfectDays() {
      const currentUser  = getUser();
      const totalPerfect = currentUser?.dias_perfectos ?? 0;

      document.getElementById('perfectDaysCount').textContent = totalPerfect;
      // Mostrar el número también en el anillo como indicador visual
      document.getElementById('perfectVal').textContent = totalPerfect > 0 ? `${totalPerfect}` : '—';

      // Animar el anillo: llenamos proporcionalmente hasta un máx de 30 días perfectos como referencia visual
      const pct = Math.min(100, Math.round((totalPerfect / Math.max(1, 30)) * 100));
      setTimeout(() => {
        const ringLength = 213.6; // 2 * PI * 34
        document.getElementById('perfectRing').style.strokeDashoffset = ringLength - (ringLength * pct / 100);
      }, 100);
    }

    // ── Handler del botón Recalcular ──
    async function onRecalcularStats() {
      const btn  = document.getElementById('btnRecalcularStats');
      const icon = document.getElementById('iconRecalcStats');

      // Animación de giro durante el proceso
      btn.disabled = true;
      icon.style.animation = 'spin 0.8s linear infinite';
      icon.style.transformOrigin = 'center';
      if (!document.getElementById('_spin-kf')) {
        const s = document.createElement('style');
        s.id = '_spin-kf';
        s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(s);
      }

      await recalcularDiasPerfectos(targets);

      // Restaurar botón
      btn.disabled = false;
      icon.style.animation = '';
    }

    // ── Escuchar actualizaciones desde evaluarDiaPerfecto() o recalcularDiasPerfectos() ──
    window.addEventListener('diasPerfectosActualizados', () => {
      renderPerfectDays();
    });

    async function renderWeightTracker() {
      const dateInput = document.getElementById('weightDateSel');
      if (!dateInput.value) dateInput.value = todayKey();

      const selDate = dateInput.value;
      const currentWeight = getWeightForDate(selDate) || user?.weight || 70;
      document.getElementById('currentWeightVal').innerHTML = `${currentWeight} <span>kg</span>`;

      let history = await fetchWeightHistory(30);

      if (history.length === 0) {
        history = getWeightHistory().map(e => ({ fecha: e.date, peso: e.weight }));
      }

      history.forEach(e => addWeightEntry(e.peso, e.fecha));

      if (history.length === 0) {
        addWeightEntry(currentWeight, todayKey());
        history = [{ fecha: todayKey(), peso: currentWeight }];
      }

      const weights = history.map(e => e.peso);
      const labels  = history.map(e => {
        const [y, m, d] = e.fecha.split('-');
        return `${d}/${m}`;
      });

      if (weights.length === 1) {
        const d = new Date(history[0].date + 'T12:00:00');
        d.setDate(d.getDate() - 7);
        const m      = String(d.getMonth() + 1).padStart(2, '0');
        const dayStr = String(d.getDate()).padStart(2, '0');
        weights.unshift(weights[0]);
        labels.unshift(`${dayStr}/${m}`);
      }

      const ctx = document.getElementById('weightChart').getContext('2d');
      if (window.myWeightChart) window.myWeightChart.destroy();

      window.myWeightChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Peso (Kg)',
            data: weights,
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34, 197, 94, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0,
            pointRadius: 4,
            pointBackgroundColor: '#22c55e',
            pointHoverRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
          scales: {
            x: {
              display: true,
              grid: { display: false },
              ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }
            },
            y: {
              display: true,
              grid: { color: 'rgba(255,255,255,0.05)' },
              suggestedMin: Math.min(...weights) - 2,
              suggestedMax: Math.max(...weights) + 2,
              position: 'right',
              ticks: { color: 'rgba(255,255,255,0.5)', font: { size: 10 } }
            }
          }
        }
      });
    }

    async function promptNewWeight() {
      const dateInput = document.getElementById('weightDateSel');
      const selDate   = dateInput.value || todayKey();
      const currentW  = getWeightForDate(selDate) || user?.weight || 70;

      const w = prompt(`Ingresa tu peso para el día ${selDate} (kg):`, currentW);
      if (w) {
        const normalizedW = w.replace(',', '.');
        if (!isNaN(parseFloat(normalizedW))) {
          const newWeight = parseFloat(normalizedW);

          addWeightEntry(newWeight, selDate);
          if (selDate >= todayKey()) saveUser({ ...user, weight: newWeight });

          const regId = await ensureDailyRecord(selDate, newWeight);
          if (regId) await updateDailyWeight(regId, newWeight);

          showToast('Peso actualizado ✓', 'success');
          await renderWeightTracker();
        }
      }
    }

    function renderWeeklyAvg() {
      const logs = getLogs();
      const keys = Object.keys(logs).sort().slice(-7);
      if (keys.length === 0) return;

      const sums = keys.reduce((acc, k) => {
        const t = getDailyTotals(logs[k]);
        acc.c += t.calories; acc.p += t.protein; acc.car += t.carbs; acc.f += t.fat;
        return acc;
      }, { c: 0, p: 0, car: 0, f: 0 });

      const count = keys.length;
      document.getElementById('avgCalVal').innerHTML = `${Math.round(sums.c / count)} <span>kcal / día</span>`;
      document.getElementById('avgProVal').textContent = Math.round(sums.p / count);
      document.getElementById('avgCarVal').textContent = Math.round(sums.car / count);
      document.getElementById('avgFatVal').textContent = Math.round(sums.f / count);
    }

    renderPage();
  </script>
</body>

</html>
